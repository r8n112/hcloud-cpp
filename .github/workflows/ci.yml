name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.sanitize }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            sanitize: address,undefined
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            sanitize: address,undefined
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            sanitize: thread
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            sanitize: address,undefined
    env:
      # Use the C++ driver (g++/clang++) so the C++ runtime is linked; using the
      # C driver (gcc/clang) as CXX fails to link libstdc++/libc++.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1
      - name: Toolchain info
        run: |
          $CXX --version | head -1
          printf '#include <expected>\nint main(){ std::expected<int,int> e=1; return *e; }\n' > /tmp/probe.cpp
          $CXX -std=c++23 /tmp/probe.cpp -o /tmp/probe && echo "std::expected probe: OK" || echo "std::expected probe: FAIL"
          echo | $CXX -std=c++23 -v -E -x c++ - 2>&1 | grep -E "Selected GCC|/include/c\\+\\+" || true
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DR8N112_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build --parallel --verbose
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format check
        run: |
          find src include tests examples -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
