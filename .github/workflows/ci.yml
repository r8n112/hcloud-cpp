name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.sanitize }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            sanitize: address,undefined
            cxxflags: ""
            packages: ""
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            sanitize: address,undefined
            cxxflags: "-stdlib=libc++"
            packages: "libc++-dev libc++abi-dev"
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            sanitize: thread
            cxxflags: "-stdlib=libc++"
            packages: "libc++-dev libc++abi-dev"
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            sanitize: address,undefined
            cxxflags: "-stdlib=libc++"
            packages: ""
    env:
      # Use the C++ driver (g++/clang++) so the C++ runtime is linked.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # On Linux, Clang's -std=c++23 reports __cplusplus below the libstdc++ gate
      # for <expected>, so use libc++ there. (GCC and AppleClang are unaffected.)
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - uses: hendrikmuhs/ccache-action@v1
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DR8N112_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format check
        run: |
          find src include tests examples -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
